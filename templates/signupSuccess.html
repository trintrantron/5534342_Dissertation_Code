<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Quack</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 100px;
            background-color: #dedeff;
            min-height: 100vh;
            text-align: center;
        }

        .banner {
            width: 100%;
            height: 100px;
            background-color: #9391ff; 
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            border-bottom:  5px solid #000000;
            z-index: 999;
        }

        h1 {
            text-align: center;
            font-size: 50px;
            font-family: "Raleway", sans-serif;
            color: #000000;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        h2 {
            text-align: center;
            font-size: 24px;
            font-family: "Raleway", sans-serif;
            color: #000000;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .purple {
            text-align: center;
            font-size: 24px;
            font-family: "Raleway", sans-serif;
            color: #635dff;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .orange {
            text-align: center;
            font-size: 24px;
            font-family: "Raleway", sans-serif;
            color: #fc9432;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        a {
            text-decoration: none;
            font-family: "Raleway", sans-serif;;
            font-size: 18px;
            color: #262626;
            display: block;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }
        
        #bannerText {
            position: center;
            height: 98px;
        }

        #bannerLogo {
            height: 100px;
            position: relative;
            right: -5px;
        }

        #logo {
            width: 30%;
            position: center;
        }

        a:hover {
            color: #fc9432;
        }

    </style>
</head>

<body>
    <div class="banner">
        <img id="bannerLogo" src="{{ url_for('static', filename='trinTranTronLogoWithBorder.svg') }}">
        <img id="bannerText" src="{{ url_for('static', filename='trinTranTronPresents.svg') }}">
    </div>
    <h1>Account created!</h1>
    <h2>Welcome to cyber quack! <span class="purple">- TrinTranTron</span></h2>
    <a href="/">Return to login</a>
    <h1>------------------------------</h1>
    <img id="logo" src="{{ url_for('static', filename='smallCyberQuackLogo.svg') }}">
    <h1>------------------------------</h1>
</body>
</html>
