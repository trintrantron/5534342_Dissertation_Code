<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>
    const socket = io({
        reconnection: false
    });

    socket.on("connect", function () {
        socket.emit("join_class");
        });

    socket.on("game_over", function () {
        socket.disconnect();
        window.location.href = "/student_results";
    });

    socket.on("disconnect", function () {
        console.log("Disconnected");
    });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Quack</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 100px;
            background-color: #dedeff;
            min-height: 100vh;
            text-align: center;
        }

        form {
            background-color: #fff;
            padding: 24px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
            width: min(420px, 90vw);
            max-width: 420px;
            box-sizing: border-box;
            margin-bottom: 130px;
        }

        label {
            text-align: center;
            font-size: 20px;
            font-family: inherit;
            color: #635dff;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        .banner {
            width: 100%;
            height: 100px;
            background-color: #9391ff; 
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            border-bottom:  5px solid #000000;
            z-index: 999;
            align-items: flex-start;
            padding-top: 10px;
        }

        h1 {
            text-align: center;
            font-size: 50px;
            font-family: "Raleway", sans-serif;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 30px;
        }

        
        h2 {
            text-align: center;
            font-size: 24px;
            font-family: "Raleway", sans-serif;
            color: #000000;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .purple {
            text-align: center;
            font-size: 24px;
            font-family: "Raleway", sans-serif;
            color: #635dff;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .orange {
            text-align: center;
            font-size: 24px;
            font-family: "Raleway", sans-serif;
            color: #fc9432;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        .login input,
        .login button {
            display: block;
            margin: 20px auto;
            max-width: 100%;
            width: 100%;
            box-sizing: border-box;
        }
        
        .login input {
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-family: inherit;
        }
        
        .login button {
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: inherit;
            align-items: center;
            background-color: #9391ff;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
        }

        button:hover {
            background-color: #fc9432;
        }
        
        button:hover {
            background-color: #fc9432;
        }

        .logout {
            width: 160px;
            height: 60px;
            position: absolute;
            right: 30px;
            top: 20px;
            background-color: #dedeff;
            color: #000000;
            font-size: 20px;
            border: 5px solid #000000;
        }
        
        #bannerText {
            position: center;
            height: 98px;
        }

        #bannerLogo {
            height: 100px;
            position: relative;
            right: -5px;
        }

        .noform {
            width: 1px;
            height: 1px;
            background-color: #9391ff;
            padding: 0px;
            border-radius: 0px;
        }

        .noform1 {
            width: auto;
            height: auto;
            background-color: transparent;
            padding: 0;
            margin: 0;
        }

        .noform1 input {
            width: 370px;
            max-width: 100%;
            padding: 16px;
            font-size: 20px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-family: inherit;
            margin: 20px auto;
            display: block;
            box-sizing: border-box;
            background-color: #dedeff;
            color: #000000;
        }

        .options {
            background-color: #9391ff;
            padding: 30px;
            border-radius: 10px;
            align-self: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.1);
        }

        .options:hover {
            scale: 1.05;
        }

        #buttonSticker {
            width: 350px;
        }

        .score {
            position: absolute;
            right: 210px;
            top: 30px;
            text-align: right;
            font-size: 40px;
            font-family: "Raleway", sans-serif;
            color: #ffffff;
            font-weight: bold;
            margin-right: 50px;
        }

        .buttonTitle {
            text-align: center;
            font-size: 40px;
            font-family: "Raleway", sans-serif;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .taskDescription {
            text-align: center;
            font-size: 27px;
            font-family: "Raleway", sans-serif;
            color: #000000;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .title {
            text-align: center;
            font-size: 50px;
            font-family: "Raleway", sans-serif;
            color: #000000;
            font-weight: bold;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            font-family: "Raleway", sans-serif;;
            font-size: 25px;
            color: #635dff;
            display: block;
            font-weight: bold;
            text-align: center;
        }

        a:hover {
            color: #fc9432;
        }

        .menu {
            position: absolute;
            position: fixed;
            left: 0px;
            top: 100px;
            background-color: #9391ff;
            font-family: "Raleway", sans-serif;
            height: 100%;
            width: 430px;
            padding:20px
        }

        #flag {
            position: absolute;
            left: 216px;
            bottom: 155px;
            width: 150px;
            height: 15px;
            background-color: #dedeff;
            color: #000000;
            font-size: 20px;
            border: 5px solid #000000;
            padding: 0;
            margin: 0;
        }

        #ctf {
            position: absolute;
            position: fixed;
            left: 108px;
            bottom: 15px;
            font-size: 40px;
            color: #ffffff;
        }

        #ctf1 {
            position: absolute;
            position: fixed;
            left: 412px;
            bottom: 15px;
            font-size: 40px;
            color: #ffffff;
        }

        #ctf2 {
            position: absolute;
            position: fixed;
            left: 212px;
            bottom: 5px;
        }

        #flagDescription {
            position: absolute;
            position: fixed;
            left: 15px;
            bottom: 100px;
            color: #ffffff;
        }

        .note {
            position: fixed;
            right: clamp(1rem, 3vw, 2rem);
            top: calc(100px + 1.5rem);
            font-family: "Raleway", sans-serif;
            width: clamp(260px, 30vw, 420px);
            max-width: 420px;
            margin: 0;
        }

        #note {
            width: 100%;
            height: auto;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.1);
            display: block;
        }

        .login {
            width: min(360px, 85vw);
            max-width: 360px;
            margin-top: 20px;
            padding: 20px;
            height: auto;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: fixed;
        }

        .logout {
            width: 160px;
            height: 60px;
            position: absolute;
            right: 30px;
            top: 20px;
            background-color: #dedeff;
            color: #000000;
            font-size: 20px;
            border: 5px solid #000000; 
        }

        @media screen and (max-width: 650px) {
            .login {
                width: min(320px, 90vw);
                top: calc(100px + 4rem);
                padding: 10px;
                transform: translateX(-50%);
            }

            .login h2 {
                font-size: 18px;
            }

            #profile {
                width: 100px;
            }

            .login input,
            .login button {
                margin: 15px auto;
            }
        }

        #profile {
            width:300px;
            margin: 1px;
        }
    </style>
</head>

<body>
    <div class="banner">
        <img id="bannerLogo" src="{{ url_for('static', filename='smallCyberQuackBannerNoBackground.svg') }}">
        <h2>Welcome {{username}}!</h2>
        <form class="noform" action="/logout_student" method ="POST">
            <button class="logout" type="submit">Logout</button>
        </form>
        <div class="score">Current score: {{score}}!</div>
    </div>
    <div class="menu">
        <a href="/challenge_page">Return to challenge page</a>
        <h1><u>Challenge brief:</u></h1>
        <div class="taskDescription">You are trying to break into Hannah's computer...</div>
        <div class="taskDescription">Keep trying passwords until you find the right one!</div>
        <div class="taskDescription" id="flagDescription">The flag is Hannah's password:</div>
        <h2 id="ctf">CTF {</h2>
        <h2 id="ctf1">}</h2>
        <form class="noform1" action="/flag_1" method="post">
            <input type="text" id="flag" name="flag" placeholder="Flag" required>
        </form>
        <label id="ctf2">{{message1}}</label>
    </div>
    <div>
        <br><br><br><form class="login" action="/login_challenge_1" method="post">
            <img id="profile" src="{{ url_for('static', filename='hannah.png') }}">
            <h2>Welcome back Hannah!</h2>
            <h2>Please enter your password:</h2>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <button type="submit">Sign in</button>
            <label class="ctf2">{{message}}<label>
        </form>
    </div>
    <div class="note">
        <img id="note" src="{{ url_for('static', filename='stickyNote.png') }}">
    </div>
    

</body>
</html>
