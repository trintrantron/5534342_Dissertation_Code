<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>
    const socket = io({
        reconnection: false
    });

    socket.on("connect", function () {
        socket.emit("join_class");
        });

    socket.on("game_over", function () {
        socket.disconnect();
        window.location.href = "/student_results";
    });

    socket.on("disconnect", function () {
        console.log("Disconnected");
    });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Quack</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 100px;
            background-color: #dedeff;
            min-height: 100vh;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(0.75rem, 1.5vw, 1.25rem);
            padding-top: clamp(5.5rem, 7.5vh, 7rem);
            text-align: center;
        }

        .column {
            flex: 1 1 280px;
            min-width: 260px;
            max-width: clamp(340px, 36vw, 520px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(0.75rem, 1vw, 1rem);
        }

        @media screen and (max-width: 768px) {
            .column {
                min-width: 100%;
            }
        }

        form {
            background-color: #fff;
            padding: 0;
            min-height: 350px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin: clamp(1rem, 2vh, 1.5rem) 0;
        }

        .options {
            width: 100%;
            background-color: #9391ff;
            padding: clamp(1rem, 2vw, 1.5rem);
            border-radius: clamp(10px, 1.5vw, 18px);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(0.75rem, 1.5vw, 1rem);
            border: none;
            cursor: pointer;
            color: #fff;
            text-align: center;
            overflow: hidden;
        }

        .options:hover {
            background-color: #fc9432;
            transform: scale(1.03);
        }

        #buttonSticker {
            width: 100%;
            max-width: clamp(220px, 28vw, 340px);
            height: auto;
            display: block;
        }

        .banner {
            width: 100%;
            height: 100px;
            background-color: #9391ff; 
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            border-bottom:  5px solid #000000;
            z-index: 999;
        }
        
        h2 {
            text-align: center;
            font-size: 24px;
            font-family: "Raleway", sans-serif;
            color: #000000;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .purple {
            text-align: center;
            font-size: 24px;
            font-family: "Raleway", sans-serif;
            color: #635dff;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .orange {
            text-align: center;
            font-size: 24px;
            font-family: "Raleway", sans-serif;
            color: #fc9432;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        input,
        button {
            display: block;
            margin: 20px 0;
        }
        
        input {
            width: 370px;
            padding: 16px;
            font-size: 20px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-family: inherit;
            margin: 1 auto;
        }
        
        button {
            width: 405px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: inherit;
            align-items: center;
            background-color: #9391ff;
            color: #fff;
            cursor: pointer;
            margin: 0 auto;
            font-weight: bold;
            font-size: 22px;
        }
        
        button:hover {
            background-color: #fc9432;
        }

        .logout {
            width: 160px;
            height: 60px;
            position: absolute;
            right: 30px;
            top: 20px;
            background-color: #dedeff;
            color: #000000;
            font-size: 20px;
            border: 5px solid #000000;
        }
        
        #bannerText {
            position: center;
            height: 98px;
        }

        #bannerLogo {
            height: 100px;
            position: relative;
            right: -5px;
        }

        .noform {
            width: 1px;
            height: 1px;
            background-color: #9391ff;
            padding: 0px;
            border-radius: 0px;
        }

        .options {
            width: 100%;
            background-color: #9391ff;
            padding: clamp(1rem, 2vw, 1.5rem);
            border-radius: clamp(10px, 1.5vw, 18px);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(0.75rem, 1.5vw, 1rem);
            border: none;
            cursor: pointer;
            color: #fff;
            text-align: center;
        }

        .options:hover {
            background-color: #fc9432;
            transform: scale(1.03);
        }

        #buttonSticker {
            width: 100%;
            max-width: clamp(220px, 28vw, 340px);
            height: auto;
        }

        .score {
            position: absolute;
            right: 210px;
            top: 30px;
            text-align: right;
            font-size: 40px;
            font-family: "Raleway", sans-serif;
            color: #ffffff;
            font-weight: bold;
            margin-right: 50px;
        }

        .buttonTitle {
            text-align: center;
            font-size: 40px;
            font-family: "Raleway", sans-serif;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .buttonDescription {
            text-align: center;
            font-size: 20px;
            font-family: "Raleway", sans-serif;
            color: #000000;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .title {
            text-align: center;
            font-size: 50px;
            font-family: "Raleway", sans-serif;
            color: #000000;
            font-weight: bold;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            font-family: "Raleway", sans-serif;;
            font-size: 30px;
            color: #9391ff;
            display: block;
            font-weight: bold;
            text-align: left;
            margin-top: 200px;
        }

        a:hover {
            color: #fc9432;
        }

        .completed {
            background-color: #a9e7af;
        }


    </style>
</head>

<body>
    <div class="banner">
        <img id="bannerLogo" src="{{ url_for('static', filename='smallCyberQuackBannerNoBackground.svg') }}">
        <h2>Welcome {{username}}!</h2>
        <form class="noform" action="/logout_student" method ="POST">
            <button class="logout" type="submit">Logout</button>
        </form>
        <div class="score">Current score: {{score}}!</div>
    </div>
    
    <div class="row">
        <div class="column">
            <form action="/practice" method ="POST">
                <button class="options {% if flags[0] %}completed{% endif %}" type="submit"><img id="buttonSticker" src="{{ url_for('static', filename='gooseHeadNoBackground.svg') }}"><span class="buttonTitle">Practice!</span><span class="buttonDescription">This practice challenge is worth 10 points and is your chance to practice entering a flag!</span></button>
            </form>
            <form action="/challenge_3" method ="POST">
                <button class="options {% if flags[3] %}completed{% endif %}" type="submit"><img id="buttonSticker" src="{{ url_for('static', filename='threeGoosesImg.png') }}"><span class="buttonTitle">Challenge 3</span><span class="buttonDescription">This challenge is an introduction to digital forensics, which is like detective work on computers!</span></button>
            </form>
        </div>

        <div class="column">
            <form action="/challenge_1" method ="POST">
                <button class="options {% if flags[1] %}completed{% endif %}" type="submit"><img id="buttonSticker" src="{{ url_for('static', filename='threeGoosesImg.png') }}"><span class="buttonTitle">Challenge 1</span><span class="buttonDescription">This challenge is an introduction to cracking passwords!</span></button>
            </form>
            <form action="/challenge_4" method ="POST">
                <button class="options {% if flags[4] %}completed{% endif %}" type="submit"><img id="buttonSticker" src="{{ url_for('static', filename='haveAQuackNoTitle.svg') }}"><span class="buttonTitle">Challenge 4</span><span class="buttonDescription">This challenge is an introduction to open source intelligence, which involves exploiting publicly available information!</span></button>
            </form>
            <a href="/tutorial">Return to tutorial</a>
        </div>

        <div class="column">
            <form action="/challenge_2" method ="POST">
                <button class="options {% if flags[2] %}completed{% endif %}" type="submit"><img id="buttonSticker" src="{{ url_for('static', filename='haveAQuackNoTitle.svg') }}"><span class="buttonTitle">Challenge 2</span><span class="buttonDescription">This challenge is an introduction to cryptography, which is the science of secret codes to hide information!</span></button>
            </form>
            <form action="/challenge_5" method ="POST">
                <button class="options {% if flags[5] %}completed{% endif %}" type="submit"><img id="buttonSticker" src="{{ url_for('static', filename='threeGoosesImg.png') }}"><span class="buttonTitle">Challenge 5</span><span class="buttonDescription">This challenge is an introduction to network analysis, which is the interception and investigation of data sent between devices!</span></button>
            </form>
        </div>
    </div>
    

</body>
</html>
